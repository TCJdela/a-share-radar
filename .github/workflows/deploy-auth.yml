name: Deploy authentication service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-auth.yml"
      - "auth-worker/**"

permissions:
  contents: write

concurrency:
  group: deploy-auth
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      SUPER_PASSWORD: ${{ secrets.SUPER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$D1_DATABASE_ID" || { echo "Missing D1_DATABASE_ID"; exit 1; }
          test -n "$SUPER_PASSWORD" || { echo "Missing SUPER_PASSWORD"; exit 1; }

      - name: Prepare deployment configuration
        run: |
          case "$D1_DATABASE_ID" in
            *[!a-fA-F0-9-]*) echo "Invalid D1_DATABASE_ID"; exit 1 ;;
          esac
          sed "s/REPLACE_WITH_D1_DATABASE_ID/$D1_DATABASE_ID/" wrangler.toml > wrangler.deploy.toml

      - name: Initialize D1 schema
        run: npx --yes wrangler@4 d1 execute a-share-radar-auth --remote --file=schema.sql --config wrangler.deploy.toml

      - name: Deploy Worker
        id: deploy
        run: |
          npx --yes wrangler@4 deploy --config wrangler.deploy.toml 2>&1 | tee deploy.log
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | tail -1)"
          test -n "$WORKER_URL" || { echo "Worker URL not found in deploy output"; exit 1; }
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Store super account password
        run: printf '%s' "$SUPER_PASSWORD" | npx --yes wrangler@4 secret put SUPER_PASSWORD --config wrangler.deploy.toml

      - name: Activate login client
        working-directory: .
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          printf '// Generated by deploy-auth.yml from %s\nwindow.AUTH_API_BASE = "%s";\n' "$GITHUB_SHA" "$WORKER_URL" > auth-config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth-config.js
          git diff --cached --quiet || git commit -m "Activate secure authentication service"
          git push
