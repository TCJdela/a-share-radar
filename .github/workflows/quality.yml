name: Quality checks
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "scripts/**"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check Python syntax
        run: python -m py_compile scripts/update_report.py
      - name: Check required UI hooks
        run: |
          grep -q 'id="watchRows"' index.html
          grep -q 'id="globalSearch"' index.html
          grep -q 'data-chart="trend"' index.html
          grep -q 'id="fixedSectors"' index.html
